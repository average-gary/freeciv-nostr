language = "C"
header = "/* Generated by cbindgen - do not edit */"
include_guard = "FREECIV_NOSTR_FFI_H"
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Don't modify this manually. */"

# Style: tag for structs since this is C, not C++
style = "tag"

[export]
prefix = "Fcn"
item_types = ["functions", "enums", "structs", "typedefs"]

# Rename rules for exported types
[export.rename]
"FcnTurnOutcomeTag" = "FcnTurnOutcome"

# Treat opaque types as pointers (not inlined)
[export.body]

[enum]
rename_variants = "ScreamingSnakeCase"

[fn]
# Functions are already prefixed with fcn_ by convention
rename_args = "None"

[parse]
parse_deps = false
